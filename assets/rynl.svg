<svg
  width="100%"
  height="300"
  viewBox="0 0 1200 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Space gradient -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Jet glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Clip -->
    <clipPath id="screen">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>

  </defs>

  <!-- BACKGROUND -->
  <rect
    width="1200"
    height="300"
    rx="18"
    fill="url(#space)"
  />

  <g clip-path="url(#screen)">

    <!-- STARS -->

    <g fill="#ffffff">

      <circle cx="80" cy="55" r="1.5">
        <animate
          attributeName="opacity"
          values="0.2;1;0.2"
          dur="2s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="180" cy="220" r="1">
        <animate
          attributeName="opacity"
          values="1;0.2;1"
          dur="3s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="320" cy="70" r="1.5">
        <animate
          attributeName="opacity"
          values="0.2;1;0.2"
          dur="2.5s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="460" cy="240" r="1">
        <animate
          attributeName="opacity"
          values="1;0.3;1"
          dur="1.8s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="590" cy="45" r="1.3">
        <animate
          attributeName="opacity"
          values="0.2;1;0.2"
          dur="2.2s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="720" cy="210" r="1">
        <animate
          attributeName="opacity"
          values="1;0.2;1"
          dur="2.7s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="850" cy="75" r="1.5">
        <animate
          attributeName="opacity"
          values="0.2;1;0.2"
          dur="2s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="1000" cy="230" r="1">
        <animate
          attributeName="opacity"
          values="1;0.2;1"
          dur="3s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="1100" cy="50" r="1.5">
        <animate
          attributeName="opacity"
          values="0.2;1;0.2"
          dur="2.3s"
          repeatCount="indefinite"
        />
      </circle>

    </g>

    <!-- MOVING STAR LINES -->

    <g stroke="#ffffff" opacity="0.25">

      <line x1="0" y1="100" x2="60" y2="100">
        <animate
          attributeName="x1"
          from="1200"
          to="-100"
          dur="3s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="x2"
          from="1300"
          to="0"
          dur="3s"
          repeatCount="indefinite"
        />
      </line>

      <line x1="0" y1="160" x2="80" y2="160">
        <animate
          attributeName="x1"
          from="1300"
          to="-100"
          dur="4s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="x2"
          from="1380"
          to="-20"
          dur="4s"
          repeatCount="indefinite"
        />
      </line>

      <line x1="0" y1="260" x2="50" y2="260">
        <animate
          attributeName="x1"
          from="1200"
          to="-100"
          dur="2.5s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="x2"
          from="1250"
          to="-50"
          dur="2.5s"
          repeatCount="indefinite"
        />
      </line>

    </g>

    <!-- TITLE -->

    <text
      x="600"
      y="125"
      text-anchor="middle"
      fill="#ffffff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="46"
      font-weight="700"
      letter-spacing="10"
    >
      Rainniel Villela
    </text>

    <text
      x="600"
      y="160"
      text-anchor="middle"
      fill="#999999"
      font-family="monospace"
      font-size="13"
      letter-spacing="5"
    >
      CREATIVE DEVELOPER • DESIGNER
    </text>


    <!-- LASER SHOTS -->

    <g
      fill="#ffffff"
      filter="url(#glow)"
    >

      <rect
        x="0"
        y="135"
        width="45"
        height="3"
        rx="2"
      >
        <animate
          attributeName="x"
          from="-80"
          to="1250"
          dur="1.2s"
          repeatCount="indefinite"
        />
      </rect>

      <rect
        x="0"
        y="180"
        width="30"
        height="2"
        rx="2"
      >
        <animate
          attributeName="x"
          from="-100"
          to="1250"
          dur="1.6s"
          begin="0.4s"
          repeatCount="indefinite"
        />
      </rect>

      <rect
        x="0"
        y="105"
        width="35"
        height="2"
        rx="2"
      >
        <animate
          attributeName="x"
          from="-100"
          to="1250"
          dur="1.4s"
          begin="0.8s"
          repeatCount="indefinite"
        />
      </rect>

    </g>


    <!-- JET -->

    <g
      transform="translate(0 0)"
      filter="url(#glow)"
    >

      <!-- Jet animation -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          -180 40;
          250 40;
          650 80;
          1050 20;
          1350 50
        "
        dur="8s"
        repeatCount="indefinite"
      />

      <!-- JET BODY -->

      <path
        d="
          M0 80
          L65 65
          L120 25
          L105 70
          L175 75
          L205 90
          L175 100
          L105 105
          L120 145
          L65 110
          L0 100
          L35 90
          Z
        "
        fill="#eeeeee"
      />

      <!-- Jet top -->

      <path
        d="
          M65 65
          L120 25
          L105 70
          L70 82
          Z
        "
        fill="#ffffff"
      />

      <!-- Jet wing -->

      <path
        d="
          M70 85
          L155 75
          L125 105
          L65 105
          Z
        "
        fill="#bbbbbb"
      />

      <!-- Cockpit -->

      <path
        d="
          M95 65
          L120 43
          L135 68
          Z
        "
        fill="#111111"
      />

      <!-- Jet details -->

      <path
        d="
          M30 87
          L100 82
          L160 88
          L100 94
          Z
        "
        fill="#555555"
      />

      <!-- Engine flame -->

      <path
        d="
          M10 85
          L-60 70
          L-25 90
          L-65 110
          L10 100
          Z
        "
        fill="#ffffff"
      >

        <animate
          attributeName="d"
          values="
            M10 85 L-60 70 L-25 90 L-65 110 L10 100 Z;
            M10 85 L-90 65 L-35 90 L-95 115 L10 100 Z;
            M10 85 L-60 70 L-25 90 L-65 110 L10 100 Z
          "
          dur="0.25s"
          repeatCount="indefinite"
        />

      </path>

    </g>


    <!-- IMPACT / EXPLOSION EFFECT -->

    <g
      transform="translate(1080 150)"
      opacity="0"
    >

      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="0.8s"
        repeatCount="indefinite"
        begin="2s"
      />

      <circle
        r="8"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
      >
        <animate
          attributeName="r"
          values="5;35"
          dur="0.8s"
          repeatCount="indefinite"
        />
      </circle>

      <path
        d="M0 -25 L4 -8 L25 -15 L10 0 L25 15 L5 10 L0 30 L-5 10 L-25 15 L-10 0 L-25 -15 L-5 -8 Z"
        fill="#ffffff"
      >
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="0.8s"
          repeatCount="indefinite"
        />
      </path>

    </g>


    <!-- BOTTOM LABEL -->

    <text
      x="600"
      y="255"
      text-anchor="middle"
      fill="#666666"
      font-family="monospace"
      font-size="11"
      letter-spacing="3"
    >
      CODE • CREATE • BUILD • REPEAT
    </text>

    <!-- BORDER -->

    <rect
      x="1"
      y="1"
      width="1198"
      height="298"
      rx="18"
      fill="none"
      stroke="#333333"
      stroke-width="1"
    />

  </g>

</svg>