  <!-- CAT -->

  <!-- ========================= -->

<g
transform="translate(-170 0)"
fill="#111"
stroke="#111"
stroke-linecap="round"
stroke-linejoin="round"

>

```
<!-- Main movement -->
<animateTransform
  attributeName="transform"
  type="translate"
  values="
    -180 0;
    120 0;
    380 0;
    600 -18;
    800 0;
    1040 0;
    1370 0
  "
  keyTimes="
    0;
    0.20;
    0.38;
    0.52;
    0.64;
    0.82;
    1
  "
  dur="8s"
  repeatCount="indefinite"
/>

