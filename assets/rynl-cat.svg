<svg
width="100%"
height="220"
viewBox="0 0 1200 220"
xmlns="http://www.w3.org/2000/svg"
role="img"
aria-label="Animated RYNL cat"

>

  <defs>

```
<!-- Soft glow that works on both GitHub themes -->
<filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
```

  </defs>

  <!--
    Everything is kept transparent.
    GitHub supplies the light/dark background.
  -->

  <!-- ========================= -->

  <!-- BACKGROUND LITTLE PARTICLES -->

  <!-- ========================= -->

  <g fill="#777">

```
<circle cx="180" cy="150" r="2">
  <animate
    attributeName="opacity"
    values="0;0.5;0"
    dur="2s"
    repeatCount="indefinite"
  />
</circle>

<circle cx="430" cy="105" r="1.5">
  <animate
    attributeName="opacity"
    values="0.1;0.7;0.1"
    dur="2.7s"
    repeatCount="indefinite"
  />
</circle>

<circle cx="720" cy="155" r="2">
  <animate
    attributeName="opacity"
    values="0;0.6;0"
    dur="2.2s"
    repeatCount="indefinite"
  />
</circle>

<circle cx="980" cy="90" r="1.5">
  <animate
    attributeName="opacity"
    values="0;0.7;0"
    dur="3s"
    repeatCount="indefinite"
  />
</circle>
```

  </g>

