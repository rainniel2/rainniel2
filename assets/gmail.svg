<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">

  <defs>

    <!-- END OF THE CONNECTED GRADIENT -->
    <linearGradient id="bg" x1="0" y1="72" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0870B2"/>
      <stop offset="0.34" stop-color="#0B80CB"/>
      <stop offset="0.68" stop-color="#1597E7"/>
      <stop offset="1" stop-color="#52BAFF"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(330 8) rotate(140) scale(170 110)"
    >
      <stop stop-color="#83D5FF" stop-opacity=".34"/>
      <stop offset=".35" stop-color="#38A8F1" stop-opacity=".19"/>
      <stop offset=".7" stop-color="#0B7DCA" stop-opacity=".09"/>
      <stop offset="1" stop-color="#0B7DCA" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path
        d="M12 0H0V12"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".055"
      />
    </pattern>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="72" x2="360" y2="0">
      <stop stop-color="#1389D1" stop-opacity=".70"/>
      <stop offset=".55" stop-color="#35A9F0" stop-opacity=".76"/>
      <stop offset="1" stop-color="#91DBFF" stop-opacity=".88"/>
    </linearGradient>

  </defs>

  <!-- BACKGROUND -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#bg)"
  />

  <!-- GLOW -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#glow)"
  />

  <!-- PIXEL GRID -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#grid)"
  />

  <!-- BORDER -->
  <rect
    x="1.5"
    y="1.5"
    width="357"
    height="69"
    rx="11"
    stroke="url(#border)"
    stroke-width="1"
  />

  <!-- TOP LEFT PIXELS -->
  <rect x="8" y="12" width="8" height="4" fill="#55BBFF" opacity=".84"/>
  <rect x="20" y="8" width="4" height="4" fill="#55BBFF" opacity=".74"/>
  <rect x="26" y="15" width="4" height="4" fill="#88D8FF" opacity=".56"/>

  <!-- CONNECTING PIXEL TRAIL -->
  <rect x="286" y="19" width="4" height="4" fill="#8AD8FF" opacity=".30"/>
  <rect x="294" y="19" width="4" height="4" fill="#8AD8FF" opacity=".23"/>
  <rect x="302" y="19" width="4" height="4" fill="#8AD8FF" opacity=".16"/>
  <rect x="310" y="19" width="4" height="4" fill="#8AD8FF" opacity=".10"/>

  <!-- BOTTOM RIGHT PIXELS -->
  <rect x="326" y="56" width="8" height="4" fill="#67C6FF" opacity=".64"/>
  <rect x="338" y="52" width="4" height="4" fill="#79CFFF" opacity=".56"/>
  <rect x="346" y="58" width="4" height="4" fill="#A0E2FF" opacity=".44"/>

  <!-- YOUR ORIGINAL GMAIL ICON -->
  <path
    d="M27 25
       L43 37
       L59 25
       V47
       H54
       V32
       L43 40
       L32 32
       V47
       H27
       Z"
    fill="#FFFFFF"
  />

  <!-- MAIN TEXT -->
  <text
    x="78"
    y="39"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    GMAIL
  </text>

  <!-- SUBTITLE -->
  <text
    x="78"
    y="52"
    fill="#DDF4FF"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    opacity=".80"
  >
    CONTACT
  </text>

  <!-- SMALL PIXELS -->
  <rect
    x="22"
    y="15"
    width="4"
    height="4"
    fill="#61C3FF"
    opacity=".74"
  />

  <rect
    x="59"
    y="52"
    width="4"
    height="4"
    fill="#1388D2"
    opacity=".82"
  />

</svg>