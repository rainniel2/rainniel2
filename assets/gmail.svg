<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">
  <defs>

    <!-- LinkedIn blue background -->
    <linearGradient id="bg" x1="0" y1="72" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#042B49"/>
      <stop offset=".38" stop-color="#064B78"/>
      <stop offset=".68" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#43A7FF"/>
    </linearGradient>

    <!-- Blue glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(315 8) rotate(140) scale(165 105)"
    >
      <stop stop-color="#43A7FF" stop-opacity=".3"/>
      <stop offset=".35" stop-color="#0A66C2" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#07558F" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07558F" stop-opacity="0"/>
    </radialGradient>

    <!-- Pixel grid -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path
        d="M12 0H0V12"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".065"
      />
    </pattern>

    <!-- Blue border -->
    <linearGradient id="border" x1="0" y1="72" x2="360" y2="0">
      <stop stop-color="#07558F" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#0A66C2" stop-opacity=".65"/>
      <stop offset="1" stop-color="#43A7FF" stop-opacity=".75"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#bg)"
  />

  <!-- Blue glow -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#glow)"
  />

  <!-- Pixel grid -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#grid)"
  />

  <!-- Border -->
  <rect
    x="1.5"
    y="1.5"
    width="357"
    height="69"
    rx="11"
    stroke="url(#border)"
    stroke-width="1"
  />

  <!-- Pixel decorations -->
  <path
    d="M8 12h8v4H8zM20 8h4v4h-4zM332 56h8v4h-8zM344 52h4v4h-4z"
    fill="#43A7FF"
    opacity=".65"
  />

  <!-- Clean white Gmail icon -->
  <path
    d="M27 25
       L43 37
       L59 25
       V47
       H54
       V32
       L43 40
       L32 32
       V47
       H27
       Z"
    fill="#FFFFFF"
  />

  <!-- Main text -->
  <text
    x="78"
    y="39"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    GMAIL
  </text>

  <!-- Subtitle -->
  <text
    x="78"
    y="52"
    fill="#C8E7FF"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    opacity=".78"
  >
    CONTACT
  </text>

  <!-- Extra pixels -->
  <rect
    x="22"
    y="15"
    width="4"
    height="4"
    fill="#43A7FF"
    opacity=".7"
  />

  <rect
    x="59"
    y="52"
    width="4"
    height="4"
    fill="#0A66C2"
    opacity=".8"
  />

</svg>