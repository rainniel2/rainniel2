  <!-- =====================================================
       OREO FLOATING BUBBLE
       Circular / tilted / no underline
       ===================================================== -->

  <g transform="translate(1015 105)">

    <!-- Entire bubble gently pops and tilts -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="1015 112;1015 101;1015 105;1015 105;1015 112"
      keyTimes="0;0.12;0.22;0.72;1"
      dur="2.401s"
      repeatCount="indefinite"
    />

    <g>

      <!-- Slight sideways rotation -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-8 0 0;4 0 0;-4 0 0;-4 0 0;-8 0 0"
        keyTimes="0;0.15;0.25;0.72;1"
        dur="2.401s"
        repeatCount="indefinite"
      />



      <!-- Small pixel corners -->
      <rect
        x="-30"
        y="-7"
        width="4"
        height="4"
        fill="#ffffff"
        opacity="0.65"
      />

      <!-- OREO -->
      <text
        x="0"
        y="18"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="13"
        font-weight="600"
        letter-spacing="3"
      >
        oreo
      </text>

      <!-- Bubble fade -->
      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.15;0.72;1"
        dur="2.401s"
        repeatCount="indefinite"
      />

    </g>

  </g>

