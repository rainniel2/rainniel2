  <defs>

    <!-- Pixel grid -->
    <pattern
      id="pixelGrid"
      width="24"
      height="24"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M24 0H0V24"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        opacity="0.055"
      />
    </pattern>

    <!-- Background glow -->
    <radialGradient id="glow" cx="78%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#303030"/>
      <stop offset="55%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </radialGradient>

  </defs>

  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

