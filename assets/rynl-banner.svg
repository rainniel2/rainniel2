    width="1200"
    height="360"
    rx="20"
    fill="#0b0b0b"
  />

  <rect
    width="1200"
    height="360"
    rx="20"
    fill="url(#glow)"
  />

  <rect
    width="1200"
    height="360"
    rx="20"
    fill="url(#pixelGrid)"
  />

