```svg
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="190"
  viewBox="0 0 900 190"
  fill="none"
>
  <defs>

    <!-- Subtle background -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="190">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>

    <!-- Text gradients -->
    <linearGradient id="accent" x1="100" y1="0" x2="700" y2="0">
      <stop offset="0%" stop-color="#63E6FF"/>
      <stop offset="50%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#7EF29A"/>
    </linearGradient>

    <!-- Rounded background -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-opacity="0.22"
      />
    </filter>

  </defs>

  <!-- Main terminal -->
  <rect
    x="8"
    y="8"
    width="884"
    height="174"
    rx="16"
    fill="url(#bg)"
    stroke="#2A2A2A"
    stroke-width="2"
    filter="url(#shadow)"
  />

  <!-- Terminal header -->
  <rect
    x="8"
    y="8"
    width="884"
    height="30"
    rx="16"
    fill="#111111"
  />

