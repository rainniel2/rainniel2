<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">

  <defs>

    <!-- START OF THE CONNECTED GRADIENT -->
    <linearGradient id="bg" x1="0" y1="72" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#042B49"/>
      <stop offset="0.42" stop-color="#075A8F"/>
      <stop offset="0.72" stop-color="#0875C7"/>
      <stop offset="1" stop-color="#2394E8"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(330 8) rotate(140) scale(170 110)"
    >
      <stop stop-color="#48B2FF" stop-opacity=".28"/>
      <stop offset=".35" stop-color="#1B8DD9" stop-opacity=".16"/>
      <stop offset=".7" stop-color="#07558F" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07558F" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path
        d="M12 0H0V12"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".055"
      />
    </pattern>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="72" x2="360" y2="0">
      <stop stop-color="#07558F" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#1689D7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#46B1FF" stop-opacity=".8"/>
    </linearGradient>

  </defs>

  <!-- BACKGROUND -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#bg)"
  />

  <!-- GLOW -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#glow)"
  />

  <!-- PIXEL GRID -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#grid)"
  />

  <!-- BORDER -->
  <rect
    x="1.5"
    y="1.5"
    width="357"
    height="69"
    rx="11"
    stroke="url(#border)"
    stroke-width="1"
  />

  <!-- TOP LEFT PIXELS -->
  <rect x="8" y="12" width="8" height="4" fill="#43A7FF" opacity=".78"/>
  <rect x="20" y="8" width="4" height="4" fill="#43A7FF" opacity=".68"/>
  <rect x="26" y="15" width="4" height="4" fill="#43A7FF" opacity=".48"/>

  <!-- CONNECTING PIXEL TRAIL -->
  <rect x="286" y="19" width="4" height="4" fill="#62BEFF" opacity=".26"/>
  <rect x="294" y="19" width="4" height="4" fill="#62BEFF" opacity=".19"/>
  <rect x="302" y="19" width="4" height="4" fill="#62BEFF" opacity=".12"/>
  <rect x="310" y="19" width="4" height="4" fill="#62BEFF" opacity=".06"/>

  <!-- BOTTOM RIGHT PIXELS -->
  <rect x="326" y="56" width="8" height="4" fill="#3CA9FA" opacity=".55"/>
  <rect x="338" y="52" width="4" height="4" fill="#43A7FF" opacity=".48"/>
  <rect x="346" y="58" width="4" height="4" fill="#6BC7FF" opacity=".34"/>

  <!-- YOUR ORIGINAL LINKEDIN ICON -->
  <text
    x="43"
    y="44"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="22"
    font-weight="700"
  >
    in
  </text>

  <!-- MAIN TEXT -->
  <text
    x="78"
    y="39"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    LINKEDIN
  </text>

  <!-- SUBTITLE -->
  <text
    x="78"
    y="52"
    fill="#C8E7FF"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    opacity=".78"
  >
    CONNECT
  </text>

  <!-- SMALL PIXELS -->
  <rect
    x="22"
    y="15"
    width="4"
    height="4"
    fill="#43A7FF"
    opacity=".7"
  />

  <rect
    x="59"
    y="52"
    width="4"
    height="4"
    fill="#0A66C2"
    opacity=".8"
  />

</svg>