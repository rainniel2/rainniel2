<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">

  <defs>

    <!-- MIDDLE OF THE CONNECTED GRADIENT -->
    <linearGradient id="bg" x1="0" y1="72" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07578D"/>
      <stop offset="0.34" stop-color="#0871B8"/>
      <stop offset="0.68" stop-color="#138CDE"/>
      <stop offset="1" stop-color="#3CA9F5"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(330 8) rotate(140) scale(170 110)"
    >
      <stop stop-color="#61C5FF" stop-opacity=".30"/>
      <stop offset=".35" stop-color="#2A9DEB" stop-opacity=".17"/>
      <stop offset=".7" stop-color="#0872B9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0872B9" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path
        d="M12 0H0V12"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".055"
      />
    </pattern>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="72" x2="360" y2="0">
      <stop stop-color="#1184CD" stop-opacity=".68"/>
      <stop offset=".55" stop-color="#2AA3EE" stop-opacity=".72"/>
      <stop offset="1" stop-color="#69C8FF" stop-opacity=".82"/>
    </linearGradient>

  </defs>

  <!-- BACKGROUND -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#bg)"
  />

  <!-- GLOW -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#glow)"
  />

  <!-- PIXEL GRID -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#grid)"
  />

  <!-- BORDER -->
  <rect
    x="1.5"
    y="1.5"
    width="357"
    height="69"
    rx="11"
    stroke="url(#border)"
    stroke-width="1"
  />

  <!-- TOP LEFT PIXELS -->
  <rect x="8" y="12" width="8" height="4" fill="#4DB8FF" opacity=".82"/>
  <rect x="20" y="8" width="4" height="4" fill="#4DB8FF" opacity=".72"/>
  <rect x="26" y="15" width="4" height="4" fill="#79D0FF" opacity=".52"/>

  <!-- CONNECTING PIXEL TRAIL -->
  <rect x="286" y="19" width="4" height="4" fill="#79CEFF" opacity=".28"/>
  <rect x="294" y="19" width="4" height="4" fill="#79CEFF" opacity=".21"/>
  <rect x="302" y="19" width="4" height="4" fill="#79CEFF" opacity=".14"/>
  <rect x="310" y="19" width="4" height="4" fill="#79CEFF" opacity=".08"/>

  <!-- BOTTOM RIGHT PIXELS -->
  <rect x="326" y="56" width="8" height="4" fill="#55BAFF" opacity=".58"/>
  <rect x="338" y="52" width="4" height="4" fill="#66C5FF" opacity=".50"/>
  <rect x="346" y="58" width="4" height="4" fill="#8DD9FF" opacity=".38"/>

  <!-- YOUR ORIGINAL INSTAGRAM ICON -->
  <rect
    x="29"
    y="22"
    width="28"
    height="28"
    rx="7"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
  />

  <!-- CAMERA LENS -->
  <circle
    cx="43"
    cy="36"
    r="6"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
  />

  <!-- CAMERA DOT -->
  <circle
    cx="51"
    cy="28"
    r="2"
    fill="#FFFFFF"
  />

  <!-- MAIN TEXT -->
  <text
    x="78"
    y="39"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    INSTAGRAM
  </text>

  <!-- SUBTITLE -->
  <text
    x="78"
    y="52"
    fill="#CFEFFF"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    opacity=".78"
  >
    FOLLOW
  </text>

  <!-- SMALL PIXELS -->
  <rect
    x="22"
    y="15"
    width="4"
    height="4"
    fill="#50B8FF"
    opacity=".72"
  />

  <rect
    x="59"
    y="52"
    width="4"
    height="4"
    fill="#1183CE"
    opacity=".82"
  />

</svg>