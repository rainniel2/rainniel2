<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">
  <defs>

    <!-- Instagram-inspired background -->
    <linearGradient id="bg" x1="0" y1="72" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C1D95"/>
      <stop offset=".32" stop-color="#7C2D92"/>
      <stop offset=".62" stop-color="#D62976"/>
      <stop offset=".84" stop-color="#F77737"/>
      <stop offset="1" stop-color="#FCAF45"/>
    </linearGradient>

    <!-- Soft Instagram glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(300 8) rotate(145) scale(170 110)"
    >
      <stop stop-color="#FCAF45" stop-opacity=".28"/>
      <stop offset=".35" stop-color="#F77737" stop-opacity=".18"/>
      <stop offset=".65" stop-color="#D62976" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path
        d="M12 0H0V12"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity=".065"
      />
    </pattern>

    <!-- Subtle border gradient -->
    <linearGradient id="border" x1="0" y1="72" x2="360" y2="0">
      <stop stop-color="#A855F7" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#EC4899" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity=".5"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#bg)"
  />

  <!-- Glow -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#glow)"
  />

  <!-- Pixel grid -->
  <rect
    x="1"
    y="1"
    width="358"
    height="70"
    rx="12"
    fill="url(#grid)"
  />

  <!-- Border -->
  <rect
    x="1.5"
    y="1.5"
    width="357"
    height="69"
    rx="11"
    stroke="url(#border)"
    stroke-width="1"
  />

  <!-- Pixel decorations -->
  <path
    d="M8 12h8v4H8zM20 8h4v4h-4zM332 56h8v4h-8zM344 52h4v4h-4z"
    fill="#FCAF45"
    opacity=".7"
  />

  <!-- Clean white Instagram icon -->
  <rect
    x="29"
    y="22"
    width="28"
    height="28"
    rx="7"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
  />

  <!-- Camera lens -->
  <circle
    cx="43"
    cy="36"
    r="6"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
  />

  <!-- Camera dot -->
  <circle
    cx="51"
    cy="28"
    r="2"
    fill="#FFFFFF"
  />

  <!-- Main text -->
  <text
    x="78"
    y="39"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    INSTAGRAM
  </text>

  <!-- Subtitle -->
  <text
    x="78"
    y="52"
    fill="#FDE7F3"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    opacity=".78"
  >
    FOLLOW
  </text>

  <!-- Extra pixels -->
  <rect
    x="22"
    y="15"
    width="4"
    height="4"
    fill="#FCAF45"
    opacity=".7"
  />

  <rect
    x="59"
    y="52"
    width="4"
    height="4"
    fill="#EC4899"
    opacity=".65"
  />

</svg>